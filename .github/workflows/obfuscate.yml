name: Build Obfuscated Site

on:
  push:
    branches: [main, master]
    paths:
      - 'store.html'  # 仅源文件变更时触发
  workflow_dispatch:          # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # 允许推送生成的 index.html

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install javascript-obfuscator
        run: npm install -g javascript-obfuscator

      - name: Extract JS from HTML
        run: |
          node << 'SCRIPT'
          const fs = require('fs');
          const html = fs.readFileSync('store.html', 'utf8');
          const match = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!match) { console.error('No <script> block found'); process.exit(1); }
          fs.writeFileSync('/tmp/source.js', match[1]);
          console.log('JS extracted, size:', match[1].length);
          SCRIPT

      - name: Obfuscate JS
        run: |
          javascript-obfuscator /tmp/source.js \
            --output /tmp/obfuscated.js \
            --compact true \
            --self-defending false \
            --string-array true \
            --string-array-encoding base64 \
            --string-array-threshold 0.75 \
            --dead-code-injection false \
            --control-flow-flattening false \
            --rename-globals false
          echo "Obfuscation done, size: $(wc -c < /tmp/obfuscated.js) bytes"

      - name: Assemble index.html
        run: |
          node << 'SCRIPT'
          const fs = require('fs');
          const html = fs.readFileSync('store.html', 'utf8');
          const obfJs = fs.readFileSync('/tmp/obfuscated.js', 'utf8');
          const result = html.replace(/<script>([\s\S]*?)<\/script>/, '<script>' + obfJs + '<\/script>');
          fs.writeFileSync('index.html', result);
          console.log('index.html assembled, size:', result.length);
          SCRIPT

      - name: Generate Cloudflare Pages Function (API proxy)
        run: |
          mkdir -p functions/api
          cat > functions/api/[[path]].js << 'EOF'
          const UPSTREAM_BASE = 'http://appstore.cnmlynk.org/api';

          export async function onRequest(context) {
            const url = new URL(context.request.url);
            // 拼接上游 URL：/api/fs/list -> http://appstore.cnmlynk.org/api/fs/list
            const upstreamUrl = UPSTREAM_BASE + url.pathname.replace(/^\/api/, '') + url.search;

            const response = await fetch(upstreamUrl, {
              method: context.request.method,
              headers: context.request.headers,
              body: context.request.method !== 'GET' && context.request.method !== 'HEAD'
                ? context.request.body
                : undefined,
            });

            const newHeaders = new Headers(response.headers);
            newHeaders.set('Access-Control-Allow-Origin', '*');
            newHeaders.set('Access-Control-Allow-Methods', 'GET, POST, OPTIONS');
            newHeaders.set('Access-Control-Allow-Headers', 'Content-Type');

            return new Response(response.body, {
              status: response.status,
              statusText: response.statusText,
              headers: newHeaders,
            });
          }
          EOF
          echo "Pages Function generated:"
          cat functions/api/[[path]].js

      - name: Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html functions/
          # 仅在有变更时提交，避免空提交
          git diff --cached --quiet && echo "No changes, skip commit" || \
            git commit -m "chore: auto-build index.html + pages function proxy [skip ci]"
          git push
