<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>L&C 应用商店</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --secondary: #64748b;
      --success: #10b981;
      --danger: #ef4444;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,.10), 0 2px 4px -1px rgba(0,0,0,.06);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.10), 0 4px 6px -2px rgba(0,0,0,.05);
      --radius: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ===== 顶部导航 ===== */
    .header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 50%, #3b82f6 100%);
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 20px rgba(37,99,235,.4);
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
      height: 64px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 18px;
      white-space: nowrap;
    }
    .logo svg { width: 28px; height: 28px; }
    .header-title {
      color: rgba(255,255,255,.85);
      font-size: 13px;
      margin-left: 2px;
    }

    /* ===== 主体布局 ===== */
    .layout {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 24px 48px;
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 24px;
      align-items: start;
    }

    /* ===== 侧边栏 ===== */
    .sidebar {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
      position: sticky;
      top: 80px;
    }
    .sidebar-header {
      padding: 14px 16px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      background: #f8fafc;
    }
    .sidebar-menu { padding: 8px; }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all .15s;
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      user-select: none;
    }
    .menu-item:hover { background: var(--primary-light); color: var(--primary); }
    .menu-item.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 2px 8px rgba(37,99,235,.35);
    }
    .menu-item .menu-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 16px;
    }
    .menu-item.active .menu-icon { background: rgba(255,255,255,.2); }
    .menu-item:not(.active) .menu-icon { background: #f1f5f9; }
    .menu-item:not(.active):hover .menu-icon { background: var(--primary-light); }
    .menu-badge {
      margin-left: auto;
      background: rgba(37,99,235,.12);
      color: var(--primary);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 20px;
      min-width: 22px;
      text-align: center;
    }
    .menu-item.active .menu-badge { background: rgba(255,255,255,.25); color: #fff; }

    /* ===== 内容区 ===== */
    .content { min-width: 0; }
    .content-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .content-title {
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .content-title span { font-size: 22px; }
    .content-meta {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .refresh-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px;
      cursor: pointer;
      transition: all .15s;
      color: var(--text-muted);
      font-weight: 500;
    }
    .refresh-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
    .refresh-btn.loading svg { animation: spin .8s linear infinite; }

    /* ===== 视图切换按钮 ===== */
    .view-toggle {
      display: flex;
      gap: 2px;
      background: #f1f5f9;
      border-radius: var(--radius-sm);
      padding: 3px;
      border: 1px solid var(--border);
    }
    .view-btn {
      width: 30px;
      height: 28px;
      border: none;
      background: none;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: all .15s;
    }
    .view-btn:hover { color: var(--primary); background: #fff; }
    .view-btn.active { background: #fff; color: var(--primary); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .toolbar-right { display: flex; align-items: center; gap: 8px; }

    /* ===== 文件网格（卡片模式）===== */
    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }
    /* 列表模式 */
    .file-grid.list-view {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    /* 分组标题在列表模式下占全宽 */
    .file-grid.list-view .folder-section-title {
      grid-column: unset;
      margin-top: 8px;
    }

    /* ===== 卡片模式 ===== */
    .file-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      cursor: pointer;
      transition: all .18s;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }
    .file-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), #60a5fa);
      opacity: 0;
      transition: opacity .18s;
    }
    .file-card:hover {
      border-color: #93c5fd;
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }
    .file-card:hover::before { opacity: 1; }
    .file-card-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .file-icon-wrap {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 24px;
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
    }
    .file-icon-wrap.folder {
      background: linear-gradient(135deg, #fef9c3, #fde68a);
    }
    /* 卡片模式文件名：最多3行，超出省略 */
    .file-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.5;
      word-break: break-all;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }
    .file-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
    }
    .file-size {
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
      color: var(--primary);
      background: var(--primary-light);
      padding: 3px 8px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .file-date { font-size: 11px; color: var(--text-muted); }
    .folder-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 20px;
      background: #fef9c3;
      color: #92400e;
      font-weight: 600;
    }

    /* ===== 列表模式行 ===== */
    .list-view .file-card {
      flex-direction: row;
      align-items: center;
      padding: 10px 14px;
      gap: 0;
      border-radius: var(--radius-sm);
    }
    .list-view .file-card::before { display: none; }
    .list-view .file-card:hover { transform: none; background: #f8fafc; }
    .list-view .file-card-header {
      flex: 1;
      min-width: 0;
      align-items: center;
      gap: 10px;
    }
    .list-view .file-icon-wrap {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      font-size: 18px;
      flex-shrink: 0;
    }
    /* 列表模式文件名：完整显示，允许换行 */
    .list-view .file-name {
      display: block;
      -webkit-line-clamp: unset;
      overflow: visible;
      white-space: normal;
      word-break: break-all;
      font-size: 13px;
      line-height: 1.5;
    }
    .list-view .file-meta {
      flex-shrink: 0;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      margin-left: 16px;
      min-width: 90px;
    }
    .list-view .file-date { font-size: 11px; }
    /* 列表模式骨架屏 */
    .list-view .skeleton-card {
      flex-direction: row;
      align-items: center;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
    }
    .list-view .sk-bottom { display: none; }
    .list-view .sk-row { flex: 1; }

    /* ===== 骨架屏 ===== */
    .skeleton {
      background: linear-gradient(90deg, #f0f4f8 25%, #e8edf2 37%, #f0f4f8 63%);
      background-size: 400% 100%;
      animation: shimmer 1.4s ease infinite;
      border-radius: 6px;
    }
    @keyframes shimmer {
      0% { background-position: 100% 50%; }
      100% { background-position: 0 50%; }
    }
    .skeleton-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow);
    }
    .sk-row { display: flex; gap: 12px; align-items: center; }
    .sk-icon { width: 48px; height: 48px; border-radius: 10px; flex-shrink: 0; }
    .sk-lines { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .sk-line { height: 12px; }
    .sk-line.w80 { width: 80%; }
    .sk-line.w50 { width: 50%; }
    .sk-bottom { display: flex; justify-content: space-between; align-items: center; }
    .sk-pill { height: 22px; width: 60px; border-radius: 20px; }

    /* ===== 空状态 ===== */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 64px 24px;
      color: var(--text-muted);
    }
    .empty-state .empty-icon { font-size: 56px; margin-bottom: 16px; }
    .empty-state h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
    .empty-state p { font-size: 14px; }

    /* ===== 错误提示 ===== */
    .error-banner {
      grid-column: 1 / -1;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 14px 18px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ===== 详情模态框 ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.55);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 25px 50px rgba(0,0,0,.25);
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      transform: scale(.95) translateY(10px);
      transition: transform .2s;
    }
    .modal-overlay.open .modal { transform: scale(1) translateY(0); }
    .modal-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 20px 0;
    }
    .modal-file-icon {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
    }
    .modal-title { font-size: 16px; font-weight: 700; word-break: break-all; line-height: 1.4; }
    .modal-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
    .modal-close {
      margin-left: auto;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: all .15s;
      flex-shrink: 0;
      align-self: flex-start;
    }
    .modal-close:hover { background: #f1f5f9; color: var(--text); }
    .modal-body { padding: 20px; }
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .info-item {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
    }
    .info-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .info-value { font-size: 14px; font-weight: 600; color: var(--text); word-break: break-all; }
    .info-item.full { grid-column: 1 / -1; }
    .download-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--primary), #3b82f6);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
      box-shadow: 0 4px 12px rgba(37,99,235,.35);
      text-decoration: none;
    }
    .download-btn:hover {
      background: linear-gradient(135deg, var(--primary-hover), #2563eb);
      box-shadow: 0 6px 16px rgba(37,99,235,.45);
      transform: translateY(-1px);
    }
    .download-btn:active { transform: translateY(0); }
    .loading-spinner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px;
      gap: 14px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e2e8f0;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; color: var(--text-muted); }
    .copy-url-wrap {
      margin-top: 10px;
      display: flex;
      gap: 8px;
    }
    .copy-url-input {
      flex: 1;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 12px;
      color: var(--text-muted);
      background: #f8fafc;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      outline: none;
    }
    .copy-btn {
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--card-bg);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .copy-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
    .copy-btn.copied { border-color: var(--success); color: var(--success); background: #f0fdf4; }

    /* ===== 面包屑导航 ===== */
    .breadcrumb {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
      font-size: 13px;
      margin-top: 4px;
    }
    .breadcrumb-item {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
    }
    .breadcrumb-item a {
      color: var(--primary);
      cursor: pointer;
      text-decoration: none;
      font-weight: 500;
      padding: 2px 4px;
      border-radius: 4px;
      transition: background .12s;
    }
    .breadcrumb-item a:hover { background: var(--primary-light); }
    .breadcrumb-item.current { color: var(--text); font-weight: 600; }
    .breadcrumb-sep { color: #cbd5e1; font-size: 12px; }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--card-bg);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all .15s;
      margin-right: 6px;
    }
    .back-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }

    /* ===== 折叠面板（子文件夹） ===== */
    .folder-section { margin-top: 16px; }
    .folder-section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .07em;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .folder-section-title::before {
      content: '';
      display: block;
      width: 3px;
      height: 14px;
      background: var(--primary);
      border-radius: 2px;
    }

    /* ===== 分页 ===== */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 24px;
      flex-wrap: wrap;
    }
    .page-btn {
      min-width: 36px;
      height: 36px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--card-bg);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .page-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
    .page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 2px 6px rgba(37,99,235,.3); }
    .page-btn:disabled { opacity: .4; cursor: not-allowed; }
    .page-info { font-size: 13px; color: var(--text-muted); padding: 0 8px; }

    /* ===== 响应式 ===== */
    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; padding: 16px; }
      .sidebar { position: static; }
      .sidebar-menu { display: flex; gap: 6px; padding: 10px; overflow-x: auto; }
      .menu-item { flex-direction: column; gap: 4px; padding: 10px; min-width: 90px; text-align: center; font-size: 12px; }
      .menu-item .menu-icon { width: 36px; height: 36px; }
      .menu-badge { margin: 0; }
      .file-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
      .info-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- 顶部导航 -->
<header class="header">
  <div class="header-inner">
    <a class="logo" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
      </svg>
      L&C 应用商店
    </a>
    <span class="header-title">· 车载 APK 资源库</span>
  </div>
</header>

<!-- 主体 -->
<div class="layout">
  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="sidebar-header">资源分类</div>
    <nav class="sidebar-menu" id="sidebarMenu">
      <div class="menu-item active" data-path="/CarMax/地图导航" onclick="switchCategory(this)">
        <div class="menu-icon">🗺️</div>
        <span>地图导航</span>
        <span class="menu-badge" id="badge-0">-</span>
      </div>
      <div class="menu-item" data-path="/CarMax/实用工具" onclick="switchCategory(this)">
        <div class="menu-icon">🔧</div>
        <span>实用工具</span>
        <span class="menu-badge" id="badge-1">-</span>
      </div>
